<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>センマネ部 TIME SHOCK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+JP:wght@500;700;900&family=Noto+Serif+JP:wght@900&display=swap" rel="stylesheet">
<style>
:root{
  --w: min(94vw, 720px, 130vh);
  --green-1:#b6ffb0; --green-2:#3dff5e; --green-3:#00c93a; --green-4:#007d22;
  --gold-1:#fff3c4; --gold-2:#ffd75e; --gold-3:#c8912a;
  --red-1:#ff7a6e; --red-2:#ff2e1e;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:#020409;
  overflow:hidden;
  font-family:'Orbitron','Noto Sans JP',sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:calc(var(--w)*0.018);
  color:#fff;
  user-select:none;
}

/* ===== background ===== */
.bg{position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(ellipse 120% 80% at 50% 115%, #06331240 0%, transparent 55%),
    radial-gradient(ellipse 90% 60% at 50% -15%, #0a3a1a33 0%, transparent 60%),
    radial-gradient(circle at 50% 50%, #071018 0%, #020409 72%);
}
.bg.danger{
  background:
    radial-gradient(ellipse 120% 80% at 50% 115%, #33060640 0%, transparent 55%),
    radial-gradient(ellipse 90% 60% at 50% -15%, #3a0a0a33 0%, transparent 60%),
    radial-gradient(circle at 50% 50%, #180707 0%, #040202 72%);
}
.spot{position:fixed;top:-30%;width:22vw;height:160%;z-index:-1;opacity:.10;pointer-events:none;
  background:linear-gradient(to bottom,#9dffb8,transparent 75%);
  filter:blur(18px);transform-origin:top center;
  animation:sway 9s ease-in-out infinite alternate;}
.spot.l{left:5%;rotate:18deg}
.spot.r{right:5%;rotate:-18deg;animation-delay:-4.5s}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}

/* ===== title ===== */
.title{
  font-family:'Orbitron',sans-serif;font-weight:900;
  font-size:calc(var(--w)*0.044);
  letter-spacing:.2em;text-align:center;line-height:1;
  background:linear-gradient(180deg,#fefefe 0%,#cfeada 35%,#5f9673 50%,#e8fbef 65%,#8fc4a3 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 6px #000) drop-shadow(0 0 18px #2eff7040);
}
.title small{display:block;font-size:.34em;letter-spacing:.55em;margin-bottom:.3em;
  color:#6fae8a;-webkit-text-fill-color:#6fae8a;filter:none}

/* ===== set tabs ===== */
.tabs{
  display:flex;gap:calc(var(--w)*0.008);
  max-width:96vw;overflow-x:auto;padding:4px 6px;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  font-family:'Orbitron',sans-serif;font-weight:900;
  font-size:calc(var(--w)*0.022);letter-spacing:.05em;
  padding:calc(var(--w)*0.010) calc(var(--w)*0.022);
  border-radius:999px;border:1.5px solid #1f5232;
  color:#5f9673;background:linear-gradient(180deg,#0a1c12,#050d08);
  cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0;
}
.tab:hover{border-color:#3f9a63;color:#c9ffd8}
.tab.on{
  color:#03350f;border-color:#c9ffd2;
  background:linear-gradient(180deg,#a8ffb2,#22e04e 55%,#54ff7a);
  box-shadow:0 0 12px #2eff7055;
}
.tab:active{scale:.94}

/* ===== elliptical ring ===== */
.stage{position:relative;width:var(--w);height:calc(var(--w)*0.70);flex-shrink:0;cursor:pointer}
.seg{
  position:absolute;left:50%;top:50%;
  width:calc(var(--w)*0.034);height:calc(var(--w)*0.072);
  border-radius:calc(var(--w)*0.007);
  background:linear-gradient(180deg,#20262e,#12161c);
  box-shadow:inset 0 1px 2px #0009, 0 0 2px #000;
  transition:background .18s, box-shadow .18s;
}
.seg.lit{
  background:linear-gradient(180deg,var(--green-1) 0%,var(--green-2) 35%,var(--green-3) 75%,var(--green-4) 100%);
  box-shadow:
    0 0 calc(var(--w)*0.010) #3dff5ecc,
    0 0 calc(var(--w)*0.026) #00c93a66,
    inset 0 1px 1px #ffffff88;
}
.seg.lit.red{
  background:linear-gradient(180deg,#ffd0c4 0%,var(--red-1) 30%,var(--red-2) 75%,#8f0d05 100%);
  box-shadow:
    0 0 calc(var(--w)*0.010) #ff5a3ecc,
    0 0 calc(var(--w)*0.026) #ff2e1e66,
    inset 0 1px 1px #ffffff88;
  animation:segblink .5s steps(2) infinite;
}
.seg.head{animation:headblink .34s steps(2) infinite}
@keyframes segblink{50%{filter:brightness(.55)}}
@keyframes headblink{50%{filter:brightness(2)}}

/* 1問ごとの区切り線 */
.divider{
  position:absolute;left:50%;top:50%;
  width:calc(var(--w)*0.005);height:calc(var(--w)*0.105);
  border-radius:2px;pointer-events:none;
  background:linear-gradient(180deg,var(--gold-1),var(--gold-2) 45%,var(--gold-3));
  box-shadow:0 0 calc(var(--w)*0.010) #ffd75e99;
  opacity:.9;
}
/* リング内側の設問番号 */
.qnum{
  position:absolute;left:50%;top:50%;
  font-family:'Orbitron',sans-serif;font-weight:900;
  font-size:calc(var(--w)*0.026);
  color:#2e4d3a;text-align:center;pointer-events:none;
  transition:color .2s, text-shadow .2s;
}
.qnum.cur{color:#3dff5e;text-shadow:0 0 10px #00c93a;scale:1.25}
.qnum.past{color:#173325}

/* ===== center panel (ellipse) ===== */
.hub{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:calc(var(--w)*0.64);height:calc(var(--w)*0.70*0.56);
  border-radius:50%;z-index:5;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:calc(var(--w)*0.006);
  padding:calc(var(--w)*0.02) calc(var(--w)*0.07);
  background:radial-gradient(ellipse at 50% 35%, #0c1520 0%, #060b12 60%, #02050a 100%);
  box-shadow:0 0 calc(var(--w)*0.05) #000d, inset 0 0 calc(var(--w)*0.08) #000;
  border:1.5px solid #1b2836;
  text-align:center;
}
.brand{
  font-family:'Noto Serif JP',serif;font-weight:900;
  letter-spacing:.1em;white-space:nowrap;
  font-size:calc(var(--w)*0.034);
  background:linear-gradient(180deg,var(--gold-1) 0%,var(--gold-2) 45%,var(--gold-3) 60%,var(--gold-1) 75%,var(--gold-3) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 2px #000) drop-shadow(0 0 12px #ffbf3f44);
  transform:skewX(-4deg);
  transition:font-size .3s;
}
.hub.idle .brand{font-size:calc(var(--w)*0.085)}
.qno{
  font-family:'Orbitron',sans-serif;font-weight:700;
  font-size:calc(var(--w)*0.022);letter-spacing:.35em;color:#4e8a63;
  min-height:1.2em;
}
.qno b{color:#3dff5e;font-size:1.35em;text-shadow:0 0 10px #00c93a99}
.qtext{
  font-family:'Noto Sans JP',sans-serif;font-weight:900;
  font-size:calc(var(--w)*0.036);line-height:1.4;
  color:#f2f7ff;text-shadow:0 2px 6px #000;
  display:flex;align-items:center;justify-content:center;
  min-height:calc(var(--w)*0.105);
  overflow-wrap:anywhere;
}
.qtext.long{font-size:calc(var(--w)*0.029)}
.qtext .hint{color:#39597a;font-size:.68em;font-weight:700;letter-spacing:.12em;line-height:1.8}
.qmark{
  font-family:'Orbitron',sans-serif;font-weight:900;
  font-size:.72em;letter-spacing:.08em;margin-right:.5em;
  color:#3dff5e;text-shadow:0 0 10px #00c93a88;
}
/* 解答行:問題の下に並記 */
.ansline{
  font-family:'Noto Sans JP',sans-serif;font-weight:900;
  font-size:calc(var(--w)*0.042);line-height:1.3;
  min-height:calc(var(--w)*0.06);
  display:flex;align-items:center;justify-content:center;
  overflow-wrap:anywhere;
}
.ansline .qmark{color:#ffb52e;text-shadow:0 0 10px #ff9d2e88}
.ansline .wait{
  color:#3a5a48;letter-spacing:.3em;font-size:.8em;
  animation:waitblink 1s steps(2) infinite;
}
@keyframes waitblink{50%{opacity:.3}}
.ansline .ans{
  color:var(--gold-2);
  text-shadow:0 0 14px #ffb52e99, 0 2px 4px #000;
  animation:ansin .25s ease-out;
}
.ansline.long{font-size:calc(var(--w)*0.033)}
@keyframes ansin{from{opacity:0;scale:.7}to{opacity:1;scale:1}}
.clock{
  font-family:'Orbitron',sans-serif;font-weight:900;
  font-size:calc(var(--w)*0.062);line-height:1;
  color:#3dff5e;
  text-shadow:0 0 calc(var(--w)*0.012) #00c93a, 0 0 calc(var(--w)*0.038) #00c93a77;
  font-variant-numeric:tabular-nums;letter-spacing:.05em;
  min-height:1em;
}
.clock.danger{color:#ff4b3a;text-shadow:0 0 calc(var(--w)*0.012) #ff2e1e, 0 0 calc(var(--w)*0.042) #ff000088;
  animation:blinkfast .5s steps(2) infinite;}
@keyframes blinkfast{50%{opacity:.5}}

/* time up overlay */
.timeup{
  position:absolute;inset:0;z-index:20;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse,#a00e0ecc 0%,#4d0202dd 70%);
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.timeup.show{opacity:1}
.timeup span{
  font-family:'Orbitron',sans-serif;font-weight:900;
  font-size:calc(var(--w)*0.10);letter-spacing:.06em;
  color:#fff;text-shadow:0 0 20px #ff3b2e,0 0 60px #ff0000;
  animation:tuflash .45s steps(2) infinite, tuzoom .45s ease-in-out infinite alternate;
  transform:skewX(-6deg);
}
@keyframes tuflash{50%{opacity:.25}}
@keyframes tuzoom{from{scale:.96}to{scale:1.05}}
.stage.shake{animation:shake .12s linear 14}
@keyframes shake{25%{translate:6px 2px}50%{translate:-5px -3px}75%{translate:4px -2px}}

/* ===== controls ===== */
.controls{display:flex;gap:calc(var(--w)*0.02);align-items:center;flex-wrap:wrap;justify-content:center}
button{
  font-family:'Orbitron','Noto Sans JP',sans-serif;font-weight:900;
  font-size:calc(var(--w)*0.026);letter-spacing:.12em;
  padding:calc(var(--w)*0.017) calc(var(--w)*0.045);
  border-radius:999px;border:2px solid;
  cursor:pointer;transition:all .15s;
}
button:active{scale:.94}
#startBtn{
  color:#03350f;border-color:#c9ffd2;
  background:linear-gradient(180deg,#a8ffb2,#22e04e 55%,#54ff7a);
  box-shadow:0 0 18px #2eff7066, 0 4px 12px #000a, inset 0 1px 0 #fff8;
}
#startBtn:hover{filter:brightness(1.12)}
.sub{
  color:#8fd8a8;border-color:#1f5232;
  background:linear-gradient(180deg,#0c2417,#06120c);
  box-shadow:0 4px 12px #000a;
}
.sub:hover{border-color:#3f9a63;color:#c9ffd8}
#soundBtn{font-size:calc(var(--w)*0.023);padding:calc(var(--w)*0.013) calc(var(--w)*0.025)}

/* ===== modal ===== */
.modal{
  position:fixed;inset:0;z-index:50;display:none;
  align-items:center;justify-content:center;
  background:#000b;backdrop-filter:blur(6px);
}
.modal.show{display:flex}
.sheet{
  width:min(94vw,640px);max-height:88vh;overflow-y:auto;
  border-radius:18px;padding:22px;
  background:linear-gradient(180deg,#0a1c12,#050d08);
  border:2px solid #1f5232;
  box-shadow:0 12px 50px #000d, 0 0 40px #00c93a22;
  font-family:'Noto Sans JP',sans-serif;
}
.sheet h2{
  font-family:'Orbitron','Noto Sans JP',sans-serif;font-weight:900;letter-spacing:.15em;
  font-size:18px;color:#3dff5e;text-align:center;margin-bottom:14px;
  text-shadow:0 0 12px #00c93a66;
}
.qrow{display:grid;grid-template-columns:34px 1.6fr 1fr;gap:8px;margin-bottom:8px;align-items:center}
.qrow .no{
  font-family:'Orbitron',sans-serif;font-weight:900;color:#3dff5e;text-align:center;
  font-size:15px;text-shadow:0 0 8px #00c93a66;
}
.qrow input{
  font-family:'Noto Sans JP',sans-serif;font-size:14px;font-weight:500;
  padding:9px 10px;border-radius:8px;color:#fff;
  background:#04120a;border:1.5px solid #1f5232;outline:none;
  transition:border-color .15s;
}
.qrow input:focus{border-color:#3dff5e;box-shadow:0 0 10px #00c93a33}
.qrow input::placeholder{color:#3a6a4c}
.sheet .btns{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.sheet button{font-size:13px;padding:10px 24px;letter-spacing:.1em}
#saveBtn{
  color:#03350f;border-color:#c9ffd2;
  background:linear-gradient(180deg,#a8ffb2,#22e04e 55%,#54ff7a);
  box-shadow:0 0 14px #2eff7044;
}
.arow{display:grid;grid-template-columns:34px 1.6fr 1fr;gap:8px;padding:9px 4px;border-bottom:1px solid #123324;align-items:center}
.arow .no{font-family:'Orbitron',sans-serif;font-weight:900;color:#3dff5e;text-align:center}
.arow .q{color:#dff5e8;font-size:14px;font-weight:700}
.arow .a{color:var(--gold-2);font-size:14px;font-weight:900;text-shadow:0 0 8px #ffb52e44}
.hint2{color:#4c8a63;font-size:12px;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="spot l"></div>
<div class="spot r"></div>

<div class="title"><small>QUIZ</small>TIME SHOCK</div>

<div class="tabs" id="tabs"></div>

<div class="stage" id="stage">
  <div class="hub idle" id="hub">
    <div class="brand">センマネ部</div>
    <div class="qno" id="qno"></div>
    <div class="qtext" id="qtext"><span class="hint">画面タップでスタート</span></div>
    <div class="ansline" id="ansline"></div>
    <div class="clock" id="clockNum">60</div>
  </div>
  <div class="timeup" id="timeup"><span>TIME UP!!</span></div>
</div>

<div class="controls">
  <button id="startBtn">Start</button>
  <button id="resetBtn" class="sub">Reset</button>
  <button id="editBtn" class="sub">問題編集</button>
  <button id="listBtn" class="sub">答え一覧</button>
  <button id="soundBtn" class="sub">🔊 ON</button>
</div>

<!-- question editor modal -->
<div class="modal" id="editModal">
  <div class="sheet">
    <h2 id="editTitle">問題 &amp; 答え を編集</h2>
    <div id="editRows"></div>
    <div class="btns">
      <button id="saveBtn">保存</button>
      <button id="clearBtn" class="sub">初期値に戻す</button>
      <button id="closeEditBtn" class="sub">閉じる</button>
    </div>
    <div class="hint2">この端末に自動保存されます(ブラウザのlocalStorage)</div>
  </div>
</div>

<!-- answers modal -->
<div class="modal" id="listModal">
  <div class="sheet">
    <h2 id="listTitle">答え一覧</h2>
    <div id="listRows"></div>
    <div class="btns">
      <button id="closeListBtn" class="sub">閉じる</button>
    </div>
  </div>
</div>

<script>
(() => {
  /* ================================================================
   * ▼▼▼ 設定 & 問題データ:ここを書き換えれば差し替えできます ▼▼▼
   * (ページの「問題編集」ボタンからも編集可能。編集内容は端末の
   *  localStorage に保存され、こちらの初期データより優先されます)
   * ================================================================ */
  const CONFIG = {
    TOTAL_SECONDS: 60,        // 制限時間
    SECONDS_PER_QUESTION: 10, // 1問あたりの秒数(60÷10=6問)
    ANSWER_REVEAL_AT: 9,      // 各問のこの秒数経過で答えを自動表示(=終了1秒前)
  };
  // 10セット × 6問。 { q: 問題, a: 答え }
  const DEFAULT_SETS = [
    [ // SET 1
      { q: '「森のバター」と呼ばれる食べ物は?', a: 'アボカド' },
      { q: '日本一高い山は?',                   a: '富士山' },
      { q: '1ダースは何本?',                    a: '12本' },
      { q: '信号機の真ん中の色は?',             a: '黄色' },
      { q: '「令和」の前の元号は?',             a: '平成' },
      { q: '日本一長い川は?',                   a: '信濃川' },
    ],
    [ // SET 2
      { q: '世界で一番人口が多い国は?',         a: 'インド' },
      { q: 'サイコロの1の裏の数字は?',          a: '6' },
      { q: 'トランプは全部で何枚?(ジョーカー除く)', a: '52枚' },
      { q: '一年で一番昼が短い日は?',           a: '冬至' },
      { q: '世界一高い山は?',                   a: 'エベレスト' },
      { q: '日本の都道府県はいくつ?',           a: '47' },
    ],
    [ // SET 3
      { q: '1週間は何時間?',                    a: '168時間' },
      { q: '虹の色は何色?',                     a: '7色' },
      { q: '夏のオリンピックは何年ごと?',       a: '4年ごと' },
      { q: 'サッカーは1チーム何人?',            a: '11人' },
      { q: '野球は1チーム何人?',                a: '9人' },
      { q: '卓球の1ゲームは何点先取?',          a: '11点' },
    ],
    [ // SET 4
      { q: '太陽系で一番大きい惑星は?',         a: '木星' },
      { q: '地球の衛星といえば?',               a: '月' },
      { q: '水を表す化学式は?',                 a: 'H2O' },
      { q: '光と音、速いのはどっち?',           a: '光' },
      { q: '1年が366日ある年を何という?',       a: 'うるう年' },
      { q: '日本で一番大きい湖は?',             a: '琵琶湖' },
    ],
    [ // SET 5
      { q: 'ことわざ「猫に◯◯」',               a: '小判' },
      { q: 'ことわざ「豚に◯◯」',               a: '真珠' },
      { q: '「早起きは◯◯の徳」',               a: '三文' },
      { q: '「石の上にも◯年」',                 a: '三年' },
      { q: '「七転び◯起き」',                   a: '八起き' },
      { q: '「犬も歩けば◯に当たる」',           a: '棒' },
    ],
    [ // SET 6
      { q: '「畑の肉」と呼ばれる食べ物は?',     a: '大豆' },
      { q: 'ワインの原料の果物は?',             a: 'ぶどう' },
      { q: '寿司の「ガリ」の原料は?',           a: '生姜' },
      { q: 'チーズの原料は?',                   a: '牛乳' },
      { q: 'ビールに使われる麦は?',             a: '大麦' },
      { q: 'うどんの主な原料は?',               a: '小麦粉' },
    ],
    [ // SET 7
      { q: '日本の首都は?',                     a: '東京' },
      { q: '北海道の道庁所在地は?',             a: '札幌' },
      { q: '日本一面積が大きい都道府県は?',     a: '北海道' },
      { q: '日本一面積が小さい都道府県は?',     a: '香川県' },
      { q: '富士山がまたがる2つの県は?',        a: '静岡県と山梨県' },
      { q: '日本最西端の県は?',                 a: '沖縄県' },
    ],
    [ // SET 8
      { q: 'アメリカの首都は?',                 a: 'ワシントンD.C.' },
      { q: 'フランスの首都は?',                 a: 'パリ' },
      { q: '自由の女神がある都市は?',           a: 'ニューヨーク' },
      { q: 'ピラミッドで有名な国は?',           a: 'エジプト' },
      { q: '世界一長い川は?',                   a: 'ナイル川' },
      { q: 'オーストラリアの首都は?',           a: 'キャンベラ' },
    ],
    [ // SET 9
      { q: 'じゃんけんでグーに勝つのは?',       a: 'パー' },
      { q: '一円玉の重さは?',                   a: '1グラム' },
      { q: '人の平熱はだいたい何度?',           a: '約36度' },
      { q: '将棋の駒は1人何枚?',                a: '20枚' },
      { q: 'トランプのキングの数字は?',         a: '13' },
      { q: '花札は全部で何枚?',                 a: '48枚' },
    ],
    [ // SET 10
      { q: '「乾杯」を英語で言うと?',           a: 'チアーズ(Cheers)' },
      { q: 'ビールの大瓶は約何ml?',             a: '約633ml' },
      { q: '居酒屋でとりあえず頼むものといえば?', a: 'ビール' },
      { q: '「十八番」なんと読む?',             a: 'おはこ' },
      { q: '二日酔いの原因となる物質は?',       a: 'アセトアルデヒド' },
      { q: '今夜の主役は?',                     a: 'センマネ部!' },
    ],
  ];
  /* ================================================================
   * ▲▲▲ 差し替えはここまで ▲▲▲
   * ================================================================ */

  const TOTAL = CONFIG.TOTAL_SECONDS;
  const SEG = CONFIG.SECONDS_PER_QUESTION;
  const N = Math.floor(TOTAL / SEG);
  const NUM_SETS = DEFAULT_SETS.length;

  const $ = id => document.getElementById(id);
  const stage=$('stage'), hub=$('hub'), bg=$('bg'), tabsEl=$('tabs'),
        qno=$('qno'), qtext=$('qtext'), ansline=$('ansline'), clockNum=$('clockNum'),
        timeup=$('timeup'),
        startBtn=$('startBtn'), resetBtn=$('resetBtn'), soundBtn=$('soundBtn'),
        editBtn=$('editBtn'), listBtn=$('listBtn'),
        editModal=$('editModal'), listModal=$('listModal'),
        editRows=$('editRows'), listRows=$('listRows'),
        editTitle=$('editTitle'), listTitle=$('listTitle');

  // ---- build ring elements: 60 segments + N dividers + N numbers ----
  const segs = [], dividers = [], qnums = [];
  for (let i = 0; i < TOTAL; i++) {
    const s = document.createElement('div');
    s.className = 'seg lit';
    stage.appendChild(s);
    segs.push(s);
  }
  for (let k = 0; k < N; k++) {
    const d = document.createElement('div');
    d.className = 'divider';
    stage.appendChild(d);
    dividers.push(d);
    const n = document.createElement('div');
    n.className = 'qnum';
    n.textContent = k + 1;
    stage.appendChild(n);
    qnums.push(n);
  }

  // ---- elliptical layout ----
  // セグメントは楕円周上に等角配置し、楕円の法線方向に向ける
  function layout() {
    const W = stage.clientWidth, H = stage.clientHeight;
    const segH = W * 0.072;
    const rx = W / 2 - segH / 2 - 1;
    const ry = H / 2 - segH / 2 - 1;
    const place = (el, t, rxx, ryy, rot) => {
      const x = rxx * Math.sin(t), y = -ryy * Math.cos(t);
      const phi = Math.atan2(Math.sin(t) / rxx, Math.cos(t) / ryy);
      el.style.transform =
        `translate(-50%,-50%) translate(${x.toFixed(1)}px,${y.toFixed(1)}px)` +
        (rot ? ` rotate(${phi.toFixed(4)}rad)` : '');
    };
    const step = 2 * Math.PI / TOTAL;
    segs.forEach((s, i) => place(s, (i + 0.5) * step, rx, ry, true));
    const groupStep = 2 * Math.PI / N;
    dividers.forEach((d, k) => place(d, k * groupStep, rx, ry, true));
    const inset = W * 0.075;
    qnums.forEach((n, k) => place(n, (k + 0.5) * groupStep, rx - inset, ry - inset, false));
  }
  layout();
  addEventListener('resize', layout);

  // ---- question sets (localStorage overrides DEFAULT_SETS) ----
  const KEY = 'timeshock.senmane.sets.v3';
  const KEY_SEL = 'timeshock.senmane.set.selected';
  let sets;
  try { sets = JSON.parse(localStorage.getItem(KEY)); } catch (e) { sets = null; }
  if (!Array.isArray(sets) || sets.length !== NUM_SETS) {
    sets = DEFAULT_SETS.map(s => s.map(x => ({...x})));
  }
  sets = sets.map((s, i) => {
    const arr = (Array.isArray(s) ? s : []).slice(0, N).map(x => ({q: x?.q || '', a: x?.a || ''}));
    while (arr.length < N) arr.push({q:'', a:''});
    return arr;
  });
  let setIdx = parseInt(localStorage.getItem(KEY_SEL) || '0', 10);
  if (isNaN(setIdx) || setIdx < 0 || setIdx >= NUM_SETS) setIdx = 0;

  const save = () => localStorage.setItem(KEY, JSON.stringify(sets));
  const qa = () => sets[setIdx];
  const esc = s => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // ---- set tabs ----
  const tabBtns = [];
  for (let i = 0; i < NUM_SETS; i++) {
    const b = document.createElement('button');
    b.className = 'tab';
    b.textContent = 'SET ' + (i + 1);
    b.addEventListener('click', () => selectSet(i));
    tabsEl.appendChild(b);
    tabBtns.push(b);
  }
  function renderTabs() {
    tabBtns.forEach((b, i) => b.classList.toggle('on', i === setIdx));
  }
  function selectSet(i) {
    if (i === setIdx && !running && !finished) { renderTabs(); return; }
    setIdx = i;
    localStorage.setItem(KEY_SEL, String(i));
    renderTabs();
    reset();
  }

  // editor rows
  const qInputs = [], aInputs = [];
  for (let i = 0; i < N; i++) {
    const row = document.createElement('div');
    row.className = 'qrow';
    row.innerHTML = `<div class="no">${i+1}</div>`;
    const qi = document.createElement('input');
    qi.placeholder = '問題';
    const ai = document.createElement('input');
    ai.placeholder = '答え';
    row.appendChild(qi); row.appendChild(ai);
    editRows.appendChild(row);
    qInputs.push(qi); aInputs.push(ai);
  }
  const loadEditor = () => qa().forEach((x,i)=>{ qInputs[i].value=x.q; aInputs[i].value=x.a; });
  const readEditor = () => { sets[setIdx] = qInputs.map((qi,i)=>({q:qi.value.trim(), a:aInputs[i].value.trim()})); };

  // ---- sound (WebAudio) ----
  let audioOn = true, ctx = null;
  const ac = () => (ctx ||= new (window.AudioContext || window.webkitAudioContext)());
  function blip(freq, dur, type = 'square', gain = 0.06, when = 0) {
    if (!audioOn) return;
    const a = ac(), o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(gain, a.currentTime + when);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + when + dur);
    o.connect(g).connect(a.destination);
    o.start(a.currentTime + when); o.stop(a.currentTime + when + dur + 0.02);
  }
  const tickSnd = danger => {
    blip(danger ? 1900 : 1250, 0.05, 'square', danger ? 0.10 : 0.05);
    if (danger) blip(950, 0.05, 'square', 0.06, 0.02);
  };
  const chime = () => { blip(880, 0.12, 'sine', 0.1); blip(1320, 0.22, 'sine', 0.09, 0.09); };
  const reveal = () => blip(1760, 0.15, 'triangle', 0.08);
  function buzzer() {
    if (!audioOn) return;
    for (let i = 0; i < 6; i++) blip(220, 0.28, 'sawtooth', 0.12, i * 0.36);
    for (let i = 0; i < 6; i++) blip(233, 0.28, 'sawtooth', 0.10, i * 0.36);
  }

  // ---- game state ----
  let startTs = null, raf = null, lastSec = -1, running = false, finished = false;
  let shownQ = 0, shownAns = false, forceAns = false;

  function renderCenter(qIdx, ansVisible) {
    if (qIdx !== shownQ) { shownQ = qIdx; shownAns = false; forceAns = false; qtext.dataset.q = ''; }
    const item = qa()[qIdx - 1] || {q:'',a:''};
    const showA = ansVisible || forceAns;
    if (qtext.dataset.q == qIdx && showA === shownAns) return;
    const isNew = qtext.dataset.q != qIdx;
    qtext.dataset.q = qIdx;
    qno.innerHTML = `SET ${setIdx+1} &nbsp;Q <b>${qIdx}</b> / ${N}`;
    if (isNew) {
      const t = item.q || `第${qIdx}問`;
      qtext.innerHTML = `<span><span class="qmark">Q.</span>${esc(t)}</span>`;
      qtext.classList.toggle('long', (item.q || '').length > 16);
    }
    // 解答行:出るまでは「・・・」、出ても問題は消さず並記
    if (showA) {
      if (!shownAns) reveal();
      ansline.innerHTML = `<span class="ans"><span class="qmark">A.</span>${esc(item.a) || '─'}</span>`;
      ansline.classList.toggle('long', (item.a || '').length > 12);
    } else {
      ansline.innerHTML = '<span class="wait">・・・</span>';
      ansline.classList.remove('long');
    }
    shownAns = showA;
  }

  function frame(ts) {
    if (!startTs) startTs = ts;
    const elapsed = Math.min(TOTAL, (ts - startTs) / 1000);
    const remain = TOTAL - elapsed;
    const danger = remain <= 10.4;

    // gauge: 経過した秒数ぶん消灯、先頭は点滅
    const spent = Math.floor(elapsed);
    segs.forEach((s, i) => {
      const lit = i >= spent;
      s.classList.toggle('lit', lit);
      s.classList.toggle('red', lit && danger);
      s.classList.toggle('head', i === spent);
    });

    clockNum.textContent = Math.ceil(remain);
    clockNum.classList.toggle('danger', danger && !finished);
    bg.classList.toggle('danger', danger && !finished);

    // question / answer
    const qIdx = Math.min(N, Math.floor(elapsed / SEG) + 1);
    qnums.forEach((n, k) => {
      n.classList.toggle('cur', k + 1 === qIdx);
      n.classList.toggle('past', k + 1 < qIdx);
    });
    const tInSlot = elapsed - (qIdx - 1) * SEG;
    renderCenter(qIdx, tInSlot >= CONFIG.ANSWER_REVEAL_AT);

    const whole = Math.floor(elapsed);
    if (whole !== lastSec) {
      lastSec = whole;
      if (remain > 0.2) {
        tickSnd(danger);
        if (whole > 0 && whole % SEG === 0 && whole < TOTAL) chime();
      }
    }

    if (elapsed >= TOTAL) { finish(); return; }
    raf = requestAnimationFrame(frame);
  }

  function start() {
    if (running) return;
    if (finished) reset();
    if (audioOn && ac().resume) ac().resume();
    running = true; finished = false;
    hub.classList.remove('idle');
    startBtn.textContent = 'Running';
    chime();
    raf = requestAnimationFrame(frame);
  }

  function finish() {
    running = false; finished = true;
    clockNum.textContent = '0';
    clockNum.classList.remove('danger');
    bg.classList.remove('danger');
    segs.forEach(s => s.classList.remove('lit','red','head'));
    qnums.forEach(n => n.classList.remove('cur'));
    timeup.classList.add('show');
    stage.classList.add('shake');
    startBtn.textContent = 'Start';
    buzzer();
    setTimeout(() => stage.classList.remove('shake'), 2000);
    setTimeout(openList, 2300);   // 終了後に答え合わせ
  }

  function reset() {
    cancelAnimationFrame(raf);
    running = false; finished = false; startTs = null; lastSec = -1;
    shownQ = 0; shownAns = false; forceAns = false;
    qtext.dataset.q = '';
    segs.forEach(s => { s.classList.add('lit'); s.classList.remove('red','head'); });
    qnums.forEach(n => n.classList.remove('cur','past'));
    clockNum.textContent = TOTAL;
    clockNum.classList.remove('danger');
    bg.classList.remove('danger');
    hub.classList.add('idle');
    qno.innerHTML = `SET <b>${setIdx+1}</b>`;
    qtext.innerHTML = '<span class="hint">画面タップでスタート</span>';
    qtext.classList.remove('long');
    ansline.innerHTML = '';
    ansline.classList.remove('long');
    timeup.classList.remove('show');
    stage.classList.remove('shake');
    startBtn.textContent = 'Start';
  }

  // ---- modals ----
  const openEdit = () => {
    editTitle.innerHTML = `SET ${setIdx+1} の問題 &amp; 答え を編集`;
    loadEditor();
    editModal.classList.add('show');
  };
  const closeEdit = () => editModal.classList.remove('show');
  function openList() {
    listTitle.textContent = `SET ${setIdx+1} 答え一覧`;
    listRows.innerHTML = qa().map((x,i) =>
      `<div class="arow"><div class="no">${i+1}</div><div class="q">${esc(x.q)||'<span style="color:#3a6a4c">(未設定)</span>'}</div><div class="a">${esc(x.a)}</div></div>`
    ).join('');
    listModal.classList.add('show');
  }

  editBtn.addEventListener('click', openEdit);
  $('closeEditBtn').addEventListener('click', closeEdit);
  $('saveBtn').addEventListener('click', () => { readEditor(); save(); closeEdit(); reset(); });
  $('clearBtn').addEventListener('click', () => {
    if (!confirm(`SET ${setIdx+1} の編集内容を破棄して初期の問題に戻しますか?`)) return;
    sets[setIdx] = DEFAULT_SETS[setIdx].map(x => ({...x}));
    save(); loadEditor();
  });
  listBtn.addEventListener('click', openList);
  $('closeListBtn').addEventListener('click', () => listModal.classList.remove('show'));
  [editModal, listModal].forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); }));

  startBtn.addEventListener('click', start);
  resetBtn.addEventListener('click', reset);
  soundBtn.addEventListener('click', () => {
    audioOn = !audioOn;
    soundBtn.textContent = audioOn ? '🔊 ON' : '🔇 OFF';
  });
  // リングタップ:待機中はスタート、進行中は答えを前倒し表示
  stage.addEventListener('click', () => {
    if (!running && !finished) { start(); return; }
    if (running) { forceAns = true; }
  });

  renderTabs();
  reset();
})();
</script>
</body>
</html>
